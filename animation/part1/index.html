<body>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 400px;
      height: 450px;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      transition: all 1s;
      backface-visibility: hidden;
    }

    .img1 {
      z-index: 1;
    }

    .img2 {
      transform: rotateX(-1080deg);
    }


    .box:hover {
      .img1 {
        transform: rotateX(1080deg);
      }

      .img2 {
        transform: rotateX(0);
        z-index: 1;
      }
    }
  </style>
