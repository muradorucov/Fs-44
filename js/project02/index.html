<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">


  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>


  <div class="max-w-[800px] mx-auto w-[80%] my-10 flex gap-10 flex-col">
    <div class="shadow-lg border-t border-t-[#ccc] p-4">
      <input class="w-full p-3 border border-[#ccc] outline-none" id="todoInput">
    </div>
    <div class="shadow-md border-t border-t-[#ccc] p-4 flex flex-col gap-4">
      <div class="toggleBtn flex justify-between items-center border-b border-b-[#ccc] cursor-pointer">
        <h3 class="uppercase">Continue</h3>
        <i class="bi bi-chevron-up"></i>
      </div>
      <div class="flex flex-col gap-5 " id="continueTodos">
        <img src="https://png.pngtree.com/png-vector/20250116/ourmid/pngtree-data-empty-vector-png-image_15213862.png"
          alt="" class="w-[100px] mx-auto">
      </div>
    </div>
    <div class="shadow-md border-t border-t-[#ccc] p-4 flex flex-col gap-4">
      <div class="toggleBtn flex justify-between items-center border-b border-b-[#ccc] cursor-pointer">
        <h3 class="uppercase">Completed</h3>
        <i class="bi bi-chevron-down"></i>
      </div>
      <div class="hidden flex-col gap-5" id="completedTodos">
        <img src="https://png.pngtree.com/png-vector/20250116/ourmid/pngtree-data-empty-vector-png-image_15213862.png"
          alt="" class="w-[100px] mx-auto">
      </div>
    </div>
  </div>


  <script src="./main.js" type="module"></script>
  <script src="./data.js" type="module"></script>
</body>

</html>
